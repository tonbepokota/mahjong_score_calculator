<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀 点数計算機</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 20px;
      font-size: 20px;
      text-align: center;
      font-weight: bold;
    }

    @media (min-width: 768px) {
      .row {
        display: flex;
        gap: 12px;
      }
      .row .form-group {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>麻雀 点数計算機</h1>

    <div class="row">
      <div class="form-group">
        <label>符</label>
        <select id="fu">
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
          <option value="60">60</option>
        </select>
      </div>

      <div class="form-group">
        <label>翻数</label>
        <select id="han">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>積み棒</label>
      <input type="number" id="honba" value="0" min="0">
    </div>

    <div class="form-group">
      <label>親か子か</label>
      <select id="oya">
        <option value="ko">子</option>
        <option value="oya">親</option>
      </select>
    </div>

    <button onclick="calc()">計算する</button>

    <div class="result" id="result">-</div>
  </div>

  <script>
    function calc() {
      const fu = parseInt(document.getElementById('fu').value);
      const han = parseInt(document.getElementById('han').value);
      const honba = parseInt(document.getElementById('honba').value);
      const oya = document.getElementById('oya').value;

      let base = fu * Math.pow(2, han + 2);

      if (base > 2000) base = 2000; // 満貫処理（簡易）

      let score;
      if (oya === 'oya') {
        score = base * 6;
      } else {
        score = base * 4;
      }

      score = Math.ceil(score / 100) * 100;
      score += honba * 300;

      document.getElementById('result').innerText = score + ' 点';
    }
  </script>
</body>
</html>
